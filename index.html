<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM Tool Triage Challenge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Saira:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow centred column, one screen at a time (start → question → results). Single dark Codebasics look by choice. */
:root{
  --bg:#19192F; --panel:#23233F; --panel-2:#2D2D50; --line:rgba(255,255,255,.09);
  --fg:#F2F3F8; --muted:#A9ABC6; --accent:#92D050; --accent-ink:#13230A;
  --good:#92D050; --bad:#FF6B6B; --warn:#F5B942;
  --display:"Kanit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --accent-text:#92D050; --overlay:rgba(10,10,25,.82); --dot:rgba(146,208,80,.07);
  color-scheme:dark;
}
/* Light mode, chosen with the toggle in the top bar */
:root[data-mode="light"]{
  --bg:#F3F5EF; --panel:#FFFFFF; --panel-2:#E9EDE3; --line:rgba(25,25,47,.12);
  --fg:#19192F; --muted:#575A74; --accent:#92D050; --accent-ink:#13230A; --accent-text:#3F7A12;
  --good:#5E9E25; --bad:#D94545; --warn:#B87A00; --overlay:rgba(25,25,47,.6); --dot:rgba(25,25,47,.07);
  color-scheme:light;
}
body,.opt,.rules li,.field input,.bars,.persona,.hero,.cta,.rv,.feedback,.icon-btn{transition:background-color .3s,border-color .3s,color .3s}
.top-r{display:flex;gap:8px}
.privacy{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin:0}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--accent-text);font-weight:600}
.icon-btn{white-space:nowrap;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);transition:transform .15s,background .15s}
.icon-btn:hover{background:var(--panel-2);color:var(--fg)}
.icon-btn:active{transform:scale(.94)}

.screen{display:flex;flex-direction:column;gap:18px;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,8vw,42px);font-weight:700}
h1 .hl{color:var(--accent-text)}
.lead{color:var(--muted);margin:0;font-size:17px}

/* start */
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.rules .ic{font-size:22px;width:30px;text-align:center;flex:none}
.field{display:grid;gap:6px}
.field label{font-size:14px;color:var(--muted)}
.field input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--accent-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;
  background:var(--accent);color:var(--accent-ink);transition:transform .15s,box-shadow .2s,filter .15s;text-decoration:none}
.btn:hover{box-shadow:0 6px 22px rgba(146,208,80,.3);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn .arr{transition:transform .2s}
.btn:hover .arr{transform:translateX(4px)}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{box-shadow:none;background:var(--panel-2)}
.tool-strip{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}

/* question */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qmeta{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.qcount{font-size:14px;color:var(--muted)}
.qcount b{color:var(--fg)}
.progress{height:6px;background:var(--panel);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.timer{position:relative;width:58px;height:58px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .track{stroke:var(--panel-2)}
.timer .ring{stroke:var(--accent);transition:stroke .3s}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.timer.warn .ring{stroke:var(--warn)} .timer.warn .num{color:var(--warn)}
.timer.danger .ring{stroke:var(--bad)} .timer.danger .num{color:var(--bad)}
.timer.danger{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.timer.stopped{animation:none;opacity:.5}

.stage{align-self:flex-start;font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);background:rgba(146,208,80,.1);border:1px solid rgba(146,208,80,.3);padding:4px 10px;border-radius:999px}
.scenario{font-size:clamp(19px,4.8vw,22px);font-family:var(--body);font-weight:500;line-height:1.4;margin:0}
.ask{color:var(--muted);margin:-8px 0 0;font-size:15px}

.options{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:17px;
  transition:transform .15s,border-color .15s,background .15s,box-shadow .25s,opacity .3s;animation:enter .35s ease both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt .key{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.opt .mark{margin-left:auto;font-size:20px;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.options:not(.locked) .opt:hover{transform:translateY(-2px);border-color:rgba(146,208,80,.55);background:var(--panel-2)}
.options:not(.locked) .opt:hover .key{background:var(--accent);color:var(--accent-ink)}
.options:not(.locked) .opt:active{transform:scale(.98)}
.options.locked .opt{cursor:default}
.opt.correct{border-color:var(--good);background:rgba(146,208,80,.12);box-shadow:0 0 0 4px rgba(146,208,80,.14)}
.opt.correct .key{background:var(--good);color:var(--accent-ink)}
.opt.correct .mark,.opt.wrong .mark{opacity:1;transform:none}
.opt.picked.correct{animation:glow .7s ease}
@keyframes glow{40%{box-shadow:0 0 0 10px rgba(146,208,80,.25)}}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.1);animation:shake .45s ease}
.opt.wrong .key{background:var(--bad);color:#2a0b0b}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.opt.dim{opacity:.45}

.feedback{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--panel);display:grid;gap:10px;animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.feedback.good{border-color:rgba(146,208,80,.45)}
.feedback.bad{border-color:rgba(255,107,107,.45)}
.feedback.time{border-color:rgba(245,185,66,.45)}
.fb-title{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:20px}
.fb-title .em{font-size:28px;display:inline-block;animation:bounce .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bounce{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
.fb-why{margin:0}
.tip{display:flex;gap:8px;font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.tip b{color:var(--accent-text);font-weight:600;white-space:nowrap}

/* emoji pop */
.pop{position:fixed;z-index:50;font-size:44px;pointer-events:none;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-60%) scale(1.35)}45%{transform:translate(-50%,-65%) scale(1)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100vw;height:100vh}

/* results */
.hero{text-align:center;display:grid;gap:8px;justify-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 18px}
.score{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:30px;color:var(--muted);font-weight:500}
.band{font-family:var(--display);font-weight:600;font-size:15px;padding:5px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.persona{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:enter .5s .3s ease both}
.persona .em{font-size:42px;flex:none;animation:bounce .7s .5s cubic-bezier(.3,1.6,.5,1) both}
.persona small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.persona h3{font-size:22px;color:var(--accent-text)}
.persona p{margin:2px 0 0;color:var(--fg)}
.bars{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bars h3{font-size:16px;font-weight:600}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14.5px}
.bar .val{color:var(--muted);font-variant-numeric:tabular-nums}
.bar .track{grid-column:1/-1;height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .9s cubic-bezier(.3,.8,.3,1)}
.remember{border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(146,208,80,.16),rgba(146,208,80,.04));border:1px solid rgba(146,208,80,.35);display:grid;gap:6px}
.remember small{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
.remember p{margin:0;font-size:17px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions .btn{font-size:14px;padding:12px 6px;flex-direction:column;gap:2px}
.actions .btn .e{font-size:20px}
@media (max-width:480px){.actions{grid-template-columns:repeat(2,1fr)}}
.cta{display:grid;gap:12px;text-align:center;padding:20px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.cta p{margin:0;color:var(--muted)}

.review{display:grid;gap:10px}
.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14.5px;animation:enter .3s ease both}
.rv .h{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.rv .q{color:var(--fg)}
.rv .a{color:var(--muted)} .rv .a b{color:var(--fg);font-weight:500}
.rv .ok{color:var(--good)} .rv .no{color:var(--bad)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--overlay);display:grid;place-items:center;padding:20px;animation:enter .25s ease both}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;max-width:420px;width:100%;display:grid;gap:12px;text-align:center}
.modal img{width:100%;border-radius:12px}
.modal p{margin:0;font-size:14px;color:var(--muted)}

/* streak, speed, stats */
.streak{margin-left:8px;display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;background:rgba(245,185,66,.15);color:var(--warn);border:1px solid rgba(245,185,66,.35)}
.streak.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:none}}
.fast{font-family:var(--body);font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:rgba(146,208,80,.16);color:var(--accent-text);animation:bump .5s .2s cubic-bezier(.3,1.6,.5,1) both}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats .chip{font-size:13.5px;color:var(--fg);padding:4px 12px}

/* cheat sheet */
.cheat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.cheat summary{cursor:pointer;list-style:none;padding:14px 16px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cheat summary::-webkit-details-marker{display:none}
.cheat summary .chev{transition:transform .25s;color:var(--muted)}
.cheat[open] summary .chev{transform:rotate(180deg)}
.cheat .body{padding:0 16px 16px;display:grid;gap:16px;animation:enter .3s ease both}
.cs-stage{display:grid;gap:2px}
.cs-stage small{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.cs-row{display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:14.5px;padding:7px 0;border-top:1px solid var(--line)}
.cs-row b{font-weight:600}
.cs-row span{color:var(--muted);min-width:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:70;white-space:nowrap;animation:toast 2.6s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.modal textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:110px;resize:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand"><b>Codebasics</b> · AI PM Toolkit</div>
    <div class="top-r">
      <button class="icon-btn" id="modeBtn" type="button" aria-label="Switch to light mode">☀️ Light</button>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Turn sound on">🔇 Sound</button>
    </div>
  </div>
  <main id="app" aria-live="polite"></main>
</div>

<script>
const TIME = 25;
const CTA_URL = "https://codebasics.io/bootcamps/live-ai-product-manager-bootcamp-3";

const GROUPS = {
  scout:     {name:"The Scout",           emoji:"🔭", label:"Research",          line:"You find the signal before anyone writes a line of code."},
  builder:   {name:"The Builder",         emoji:"🛠️", label:"Build & ship",      line:"You turn ideas into links people can click."},
  whisperer: {name:"The Model Whisperer", emoji:"🧠", label:"Pick the right model", line:"You know quality, speed and cost are a trade-off."},
  measurer:  {name:"The Measurer",        emoji:"📊", label:"Evaluate & track",  line:"You don't ship and pray. You measure and learn."}
};
const TIE_ORDER = ["measurer","whisperer","builder","scout"];
const FAST_SECS = 10;

const CHEAT = [
  {stage:"Research", tools:[["ChatGPT","Sum up notes, interviews and ideas."],["Perplexity","Web research with sources you can check."]]},
  {stage:"Prototype", tools:[["Lovable","A full app from simple text prompts."],["Bolt","A full-stack app in the browser from a prompt."],["v0","UI screens and components from a prompt."],["Replit","Write, run and host code in the browser."],["Cursor","AI code editor for hands-on coding."],["Claude Code","Edit real code by describing the change."]]},
  {stage:"Intelligence", tools:[["Gemini API","Use Google's Gemini models in your app."],["Groq","Very fast model replies."],["OpenRouter","One API to try many models."]]},
  {stage:"Backend", tools:[["Supabase","Database, user login and storage."],["Firebase","Google's backend: database, login, hosting."]]},
  {stage:"Deploy", tools:[["Vercel","Put your app on a link. Updates on every push."],["Netlify","Simple hosting and deploys."]]},
  {stage:"Evaluate", tools:[["Langfuse","See each AI step: prompt, docs, answer, cost."],["Ragas","Score the quality of RAG answers."]]},
  {stage:"Analytics", tools:[["Mixpanel","Funnels: where users drop off."],["Amplitude","User behaviour and retention."]]}
];

const QUESTIONS = [
  {stage:"Research", group:"scout",
   text:"You need a quick scan of AI tools for insurance claims in India. You want sources you can check.",
   options:["Mixpanel","Perplexity","Vercel","Ask your cousin who “knows startups”"], answer:1,
   why:"Perplexity searches the live web and shows its sources, so you can check every claim.",
   tip:"Use AI to speed up research. Still check the sources."},
  {stage:"Prototype", group:"builder",
   text:"You can't code. Your boss wants a clickable app for a budgeting product by Friday.",
   options:["Groq","Cursor","Lovable","A very confident PowerPoint with animations"], answer:2,
   why:"Lovable builds a working app from simple text prompts. Cursor is great too, but it's a code editor.",
   tip:"Start with the smallest version that works. Test it before adding more."},
  {stage:"Prototype", group:"builder",
   text:"Your team shared their code. You want to add a small feature by just describing it in plain English.",
   options:["Claude Code","Netlify","Amplitude","Print the code and highlight it"], answer:0,
   why:"Claude Code works inside real code. You describe the change and it edits the files for you.",
   tip:"Build on what already exists. Keep changes small and easy to test."},
  {stage:"Intelligence", group:"whisperer",
   text:"Your voice bot for a food delivery app works, but replies are slow. Callers hang up.",
   options:["Firebase","Ragas","Make the hold music louder","Groq"], answer:3,
   why:"Groq runs AI models very fast. That makes it a good fit for real-time uses like voice.",
   tip:"Choose models by quality, speed, cost and reliability."},
  {stage:"Intelligence", group:"whisperer",
   text:"You want to test GPT, Claude and Llama on the same prompts without setting up three separate APIs.",
   options:["Supabase","OpenRouter","Bolt","Ask each model which one is best"], answer:1,
   why:"OpenRouter gives you one API for many models, so you can compare them side by side.",
   tip:"Choose models by quality, speed, cost and reliability."},
  {stage:"Backend", group:"builder",
   text:"Your learning app needs users to log in. It must also save each learner's chat history.",
   options:["Perplexity","Ragas","Supabase","A Google Sheet called “users_final_v3”"], answer:2,
   why:"Supabase gives you a database, user login and file storage in one place.",
   tip:"The backend is your product's data foundation."},
  {stage:"Deploy", group:"builder",
   text:"Your app runs on your laptop. A hospital team needs a link to try it, and you'll update it daily.",
   options:["Vercel","Gemini API","Mixpanel","Share your laptop screen with them every morning"], answer:0,
   why:"Vercel puts your app on a public link and updates it every time you push a change.",
   tip:"A prototype is only testable when users can open it."},
  {stage:"Evaluate", group:"measurer",
   text:"Your HR bot confidently quotes a leave policy that doesn't exist. You need to see what went wrong inside the AI.",
   options:["Amplitude","Replit","Switch the bot off on Fridays","Langfuse"], answer:3,
   why:"Langfuse shows each AI step: the prompt, the documents it found and the answer. Amplitude tracks user clicks, not the AI.",
   tip:"Observability shows what the model did, and why."},
  {stage:"Evaluate", group:"measurer",
   text:"Before launch, you want to score your bot's answers for accuracy and relevance across 200 test questions.",
   options:["Ragas","v0","Netlify","Read 5 answers and trust your gut"], answer:0,
   why:"Ragas scores AI answers on things like faithfulness and relevance, across many questions at once.",
   tip:"Decide what “good” means first. Then measure it."},
  {stage:"Analytics", group:"measurer",
   text:"70% of users leave your travel app after their first search. You need to see where they drop off.",
   options:["Langfuse","Mixpanel","Firebase","Send everyone a “we miss you” email"], answer:1,
   why:"Mixpanel funnels show exactly where users drop off. Langfuse tracks the AI, not the user journey.",
   tip:"Product analytics shows what the user did."}
];

const app = document.getElementById("app");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = {name:"", i:0, score:0, streak:0, best:0, fast:0, answers:[], qs:QUESTIONS.map(q=>({...q}))};
let timer = {start:0, raf:0, lastSec:TIME, done:false};

/* ---------- dark / light mode (dark by default) ---------- */
const modeBtn = document.getElementById("modeBtn");
function setMode(m){
  document.documentElement.setAttribute("data-mode", m);
  modeBtn.textContent = m==="light" ? "🌙 Dark" : "☀️ Light";
  modeBtn.setAttribute("aria-label", m==="light" ? "Switch to dark mode" : "Switch to light mode");
  try { localStorage.setItem("triage-mode", m); } catch(e){}
}
let savedMode = "dark"; try { savedMode = localStorage.getItem("triage-mode") || "dark"; } catch(e){}
setMode(savedMode);
modeBtn.addEventListener("click", () => { setMode(document.documentElement.getAttribute("data-mode")==="light" ? "dark" : "light"); sfx("click"); });

/* ---------- sound (off by default) ---------- */
let soundOn = false, actx = null;
const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Sound";
  soundBtn.setAttribute("aria-pressed", soundOn);
  soundBtn.setAttribute("aria-label", soundOn ? "Turn sound off" : "Turn sound on");
  if (soundOn) { try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); } catch(e){} sfx("click"); }
});
function tone(f, d, type="sine", delay=0, vol=.07){
  if (!actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.015); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.02);
}
function sfx(kind){
  if (!soundOn || !actx) return;
  if (kind==="click") tone(660,.06,"triangle");
  if (kind==="right"){ tone(660,.12,"triangle"); tone(990,.22,"triangle",.1); }
  if (kind==="wrong"){ tone(220,.18,"sawtooth",0,.04); tone(170,.25,"sawtooth",.12,.04); }
  if (kind==="tick") tone(880,.04,"square",0,.025);
  if (kind==="time"){ tone(440,.15,"triangle"); tone(330,.25,"triangle",.15); }
  if (kind==="win"){ [523,659,784,1047].forEach((f,i)=>tone(f,.18,"triangle",i*.1)); }
}

/* ---------- effects ---------- */
const fx = document.getElementById("fx"), fctx = fx.getContext("2d");
let parts = [], fxRaf = 0;
function sizeFx(){ const d = devicePixelRatio||1; fx.width = innerWidth*d; fx.height = innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
addEventListener("resize", sizeFx); sizeFx();
function confetti(x, y, n=36){
  if (reduceMotion) return;
  const cols = ["#92D050","#F2F3F8","#F5B942","#6FC3FF","#B6E388"];
  for (let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2, s = 3+Math.random()*5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,c:cols[k%cols.length],r:3+Math.random()*3,rot:Math.random()*6});
  }
  if (!fxRaf) loopFx();
}
function loopFx(){
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.vx*=.98; p.life-=.016; p.rot+=.2;
    fctx.save(); fctx.globalAlpha=Math.max(p.life,0); fctx.translate(p.x,p.y); fctx.rotate(p.rot);
    fctx.fillStyle=p.c; fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); fctx.restore(); });
  parts = parts.filter(p=>p.life>0);
  fxRaf = parts.length ? requestAnimationFrame(loopFx) : 0;
  if (!fxRaf) fctx.clearRect(0,0,innerWidth,innerHeight);
}
function popEmoji(el, emoji){
  const r = el.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "pop"; s.textContent = emoji; s.setAttribute("aria-hidden","true");
  s.style.left = (r.right - 34) + "px"; s.style.top = (r.top + r.height/2) + "px";
  document.body.appendChild(s); setTimeout(()=>s.remove(), 1200);
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET = ["A","B","C","D"];
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffleQs(){
  state.qs = QUESTIONS.map(q=>{
    const idx = [0,1,2,3].sort(()=>Math.random()-.5);
    return {...q, options: idx.map(i=>q.options[i]), answer: idx.indexOf(q.answer)};
  });
}

/* ---------- start ---------- */
function renderStart(){
  app.innerHTML = `
  <section class="screen">

    <ul class="rules">
      <li><span class="ic">📖</span><span>Read the situation.</span></li>
      <li><span class="ic">👆</span><span>Tap the tool you'd reach for first.</span></li>

    </ul>

      <input id="nameIn" type="text" maxlength="24" autocomplete="given-name" placeholder="e.g. Priya" value="${esc(state.name)}">

    <div class="tool-strip" aria-label="Tools in this challenge">
      ${["ChatGPT","Perplexity","Lovable","Claude Code","Cursor","Groq","OpenRouter","Supabase","Vercel","Langfuse","Ragas","Mixpanel"].map(t=>`<span class="chip">${t}</span>`).join("")}

function startQuiz(shuffle){
  state.i = 0; state.score = 0; state.streak = 0; state.best = 0; state.fast = 0; state.answers = [];
  if (shuffle) shuffleQs(); else state.qs = QUESTIONS.map(q=>({...q}));
  renderQuestion();
}

/* ---------- question ---------- */
const CIRC = 2*Math.PI*24;
function renderQuestion(){
  const q = state.qs[state.i], n = state.i+1;
  app.innerHTML = `
  <section class="screen" id="qScreen">
    <div class="qhead">
      <div class="qmeta">
        <div class="qcount">Question <b>${n}</b> of 10<span class="streak" id="streak" ${state.streak>=2?"":"hidden"}>🔥 ${state.streak} in a row</span></div>
        <div class="progress"><span id="prog" style="width:${(state.i/10)*100}%"></span></div>
      </div>
      <div class="timer" id="timer" role="timer" aria-label="Seconds left">
        <svg viewBox="0 0 56 56"><circle class="track" cx="28" cy="28" r="24" fill="none" stroke-width="5"/>
        <circle class="ring" id="ring" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
        <span class="num" id="tnum">${TIME}</span>
      </div>
    </div>
    <span class="stage">${q.stage}</span>
    <p class="scenario">${esc(q.text)}</p>

    <div class="options" id="opts">
      ${q.options.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="key">${LET[k]}</span><span>${esc(o)}</span><span class="mark" aria-hidden="true"></span></button>`).join("")}
    </div>
    <div id="fb"></div>
  </section>`;
  requestAnimationFrame(()=>{ const p=document.getElementById("prog"); if(p) p.style.width = (n/10*100)+"%"; });
  document.querySelectorAll(".opt").forEach(b=> b.onclick = () => answer(+b.dataset.k));
  startTimer();
}

function startTimer(){
  cancelAnimationFrame(timer.raf);
  timer = {start:performance.now(), raf:0, lastSec:TIME, done:false};
  const ring = document.getElementById("ring"), num = document.getElementById("tnum"), box = document.getElementById("timer");
  const tick = () => {
    if (timer.done) return;
    const left = Math.max(0, TIME - (performance.now()-timer.start)/1000);
    const sec = Math.ceil(left);
    ring.style.strokeDashoffset = CIRC * (1 - left/TIME);
    if (sec !== timer.lastSec){ timer.lastSec = sec; num.textContent = sec; if (sec<=5 && sec>0) sfx("tick"); }
    box.classList.toggle("warn", left<=10 && left>5);
    box.classList.toggle("danger", left<=5);
    if (left<=0){ answer(null); return; }
    timer.raf = requestAnimationFrame(tick);
  };
  tick();
}

function answer(k){
  if (timer.done) return;
  timer.done = true; cancelAnimationFrame(timer.raf);
  document.getElementById("timer").classList.add("stopped");
  const q = state.qs[state.i], opts = document.getElementById("opts"), btns = [...opts.children];
  opts.classList.add("locked");
  const right = k === q.answer, timedOut = k === null;
  const secs = (performance.now()-timer.start)/1000, fast = right && secs < FAST_SECS;
  if (right){ state.score++; state.streak++; state.best = Math.max(state.best, state.streak); } else state.streak = 0;
  if (fast) state.fast++;
  state.answers.push({chosen:k, right, timedOut, fast});
  const sb = document.getElementById("streak");
  if (state.streak>=2){ sb.hidden = false; sb.textContent = `🔥 ${state.streak} in a row`; sb.classList.remove("bump"); void sb.offsetWidth; sb.classList.add("bump"); }
  else sb.hidden = true;

  const correctBtn = btns[q.answer];
  btns.forEach((b,i)=>{ b.disabled = true; if (i!==q.answer && i!==k) b.classList.add("dim"); });
  correctBtn.classList.add("correct"); correctBtn.querySelector(".mark").textContent = "✅";

  let cls, emoji, title;
  if (right){
    correctBtn.classList.add("picked");
    cls="good"; emoji=pick(["🎉","🙌","🔥","💚"]); title=pick(["Nailed it!","Spot on!","Great call!","Exactly right!"]);
    const r = correctBtn.getBoundingClientRect(); confetti(r.left + r.width*0.7, r.top + r.height/2);
    popEmoji(correctBtn, emoji); sfx("right");
  } else if (timedOut){
    cls="time"; emoji="⏰"; title="Time's up!";
    popEmoji(correctBtn, "⏰"); sfx("time");
  } else {
    const w = btns[k]; w.classList.add("wrong"); w.querySelector(".mark").textContent = "❌";
    cls="bad"; emoji=pick(["😅","🤔","🙈"]); title="Not quite";
    popEmoji(w, emoji); sfx("wrong");
  }

  const last = state.i === 9;
  document.getElementById("fb").innerHTML = `
    <div class="feedback ${cls}">
      <div class="fb-title" style="flex-wrap:wrap"><span class="em">${emoji}</span>${title}${fast?` <span class="fast">⚡ Speed bonus</span>`:""}${right?"":` <span style="font-family:var(--body);font-weight:500;font-size:16px;color:var(--muted)">Answer: ${esc(q.options[q.answer])}</span>`}</div>
      <p class="fb-why">${esc(q.why)}</p>
      <div class="tip"><b>PM tip</b><span>${esc(q.tip)}</span></div>
      <button class="btn" id="nextBtn" type="button">${last?"See my results":"Next question"} <span class="arr">→</span></button>
    </div>`;
  const nb = document.getElementById("nextBtn");
  nb.onclick = () => { sfx("click"); if (last) renderResults(); else { state.i++; renderQuestion(); } };
  setTimeout(()=>{ nb.focus({preventScroll:true}); document.getElementById("fb").scrollIntoView({behavior: reduceMotion?"auto":"smooth", block:"nearest"}); }, 250);
}

document.addEventListener("keydown", e=>{
  if (!document.getElementById("qScreen") || timer.done || e.target.tagName==="INPUT") return;
  const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  const k = map[e.key.toLowerCase()];
  if (k!==undefined) answer(k);
});

/* ---------- results ---------- */
function results(){
  const g = {}; Object.keys(GROUPS).forEach(k=>g[k]={got:0,total:0});
  state.qs.forEach((q,i)=>{ g[q.group].total++; if (state.answers[i]?.right) g[q.group].got++; });
  let best = TIE_ORDER[0], bestPct = -1;
  TIE_ORDER.forEach(k=>{ const p = g[k].got/g[k].total; if (p>bestPct){ bestPct=p; best=k; } });
  const s = state.score;
  const band = s>=9?["Toolkit Ready","🚀"]:s>=6?["Strong Instincts","💪"]:s>=3?["Getting There","🌱"]:["Fresh Start","✨"];
  return {g, persona:GROUPS[best], band};
}

function toast(text){
  document.querySelectorAll(".toast").forEach(t=>t.remove());

  document.body.appendChild(t); setTimeout(()=>t.remove(), 2700);

function showCopyBox(msg){

/* ---------- share card ---------- */
function wrap(ctx, text, x, y, maxW, lh){
  const words = text.split(" "); let line = "";
  for (const w of words){ const t = line ? line+" "+w : w;
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, y); line = w; y += lh; } else line = t; }
  ctx.fillText(line, x, y); return y;
}
async function makeCard(persona, band, g){
  try { await Promise.all([document.fonts.load("700 160px Kanit"), document.fonts.load("600 40px Kanit"), document.fonts.load("400 30px Saira")]); } catch(e){}
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1080; const x = c.getContext("2d");
  x.fillStyle = "#19192F"; x.fillRect(0,0,1080,1080);
  x.fillStyle = "rgba(146,208,80,.09)";
  for (let i=30;i<1080;i+=36) for (let j=30;j<1080;j+=36){ x.beginPath(); x.arc(i,j,1.6,0,7); x.fill(); }
  x.fillStyle = "#92D050"; x.fillRect(80,80,8,64);
  x.font = "600 30px Kanit, sans-serif"; x.fillStyle = "#A9ABC6"; x.fillText("THE PM TOOL TRIAGE CHALLENGE", 110, 112);
  x.font = "400 30px Saira, sans-serif"; x.fillText("Ultimate AI PM Toolkit · Codebasics", 110, 150);
  x.fillStyle = "#F2F3F8"; x.font = "600 46px Kanit, sans-serif";
  x.fillText(state.name ? `${state.name}'s result` : "My result", 80, 260);
  x.font = "700 230px Kanit, sans-serif"; x.fillStyle = "#F2F3F8"; x.fillText(String(state.score), 76, 470);
  const sw = x.measureText(String(state.score)).width;
  x.font = "500 90px Kanit, sans-serif"; x.fillStyle = "#A9ABC6"; x.fillText("/10", 90+sw, 470);
  // band pill
  x.font = "600 36px Kanit, sans-serif"; const bt = `${band[1]} ${band[0]}`, bw = x.measureText(bt).width + 56;
  x.fillStyle = "#92D050"; x.beginPath(); x.roundRect(80, 510, bw, 64, 32); x.fill();
  x.fillStyle = "#13230A"; x.fillText(bt, 108, 555);
  x.font = "500 30px Saira, sans-serif"; x.fillStyle = "#F2F3F8";
  x.fillText(`🔥 ${state.best} streak   ⚡ ${state.fast} fast`, 80 + bw + 28, 553);
  // persona
  x.fillStyle = "#23233F"; x.beginPath(); x.roundRect(80, 620, 920, 220, 28); x.fill();
  x.font = "96px sans-serif"; x.fillText(persona.emoji, 116, 770);
  x.font = "400 26px Saira, sans-serif"; x.fillStyle = "#A9ABC6"; x.fillText("MY PM TOOLKIT PERSONA", 250, 690);
  x.font = "700 56px Kanit, sans-serif"; x.fillStyle = "#92D050"; x.fillText(persona.name, 250, 752);
  x.font = "400 30px Saira, sans-serif"; x.fillStyle = "#F2F3F8"; wrap(x, persona.line, 250, 800, 720, 38);
  // mini bars
  const keys = Object.keys(GROUPS), bwid = 205;
  keys.forEach((k,i)=>{ const bx = 80 + i*(bwid+33), by = 900;
    x.font = "400 24px Saira, sans-serif"; x.fillStyle = "#A9ABC6"; x.fillText({scout:"Research",builder:"Build & ship",whisperer:"Models",measurer:"Evaluate & track"}[k], bx, by);
    x.fillStyle = "#2D2D50"; x.beginPath(); x.roundRect(bx, by+18, bwid, 14, 7); x.fill();
    x.fillStyle = "#92D050"; const fw = bwid * g[k].got/g[k].total; if (fw>0){ x.beginPath(); x.roundRect(bx, by+18, Math.max(fw,14), 14, 7); x.fill(); }
    x.font = "600 26px Kanit, sans-serif"; x.fillStyle = "#F2F3F8"; x.fillText(`${g[k].got}/${g[k].total}`, bx, by+70);
  });
  const url = c.toDataURL("image/png");
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-label","Your result card");
  m.innerHTML = `<div class="box"><img src="${url}" alt="Result card: ${state.score} out of 10, ${persona.name}">
    <p>Save it and share it on LinkedIn. If the download doesn't start, press and hold (phone) or right-click (laptop) the image to save it.</p>
    <a class="btn" id="dl" href="${url}" download="pm-tool-triage-${state.score}of10.png">Download PNG</a>
    <button class="btn ghost" id="closeM" type="button">Close</button></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector("#closeM").onclick = close;
  m.addEventListener("click", e=>{ if (e.target===m) close(); });
  m.querySelector("#closeM").focus();
}
